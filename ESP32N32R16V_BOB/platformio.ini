; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n32r16v]
platform = espressif32
board = esp32s3_n32r16v
framework = arduino
monitor_speed = 115200
board_build.flash_size = 32MB

; Match the actual N32R16V board: 32 MB octal flash + 16 MB octal PSRAM
board_build.f_cpu = 240000000L
board_build.flash_mode = opi
board_build.psram_type = opi
board_upload.maximum_size = 33554432
board_build.f_flash = 80000000L
board_build.arduino.memory_type = opi_opi
board_build.partitions = partitions_n32r16v.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -mfix-esp32-psram-cache-issue
    -O3
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git
    adafruit/Adafruit PWM Servo Driver Library